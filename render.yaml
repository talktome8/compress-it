services:
  - type: web
    name: compress-it
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_FILE_SIZE
        value: 52428800
      - key: MAX_FILES
        value: 20
    healthCheckPath: /api/health
